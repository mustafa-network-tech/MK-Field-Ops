name: mk_ops
description: MK OPS - Saha Operasyon Yönetim Platformu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Environment
  flutter_dotenv: ^5.1.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # Media
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Reports
  excel: ^4.0.2
  share_plus: ^9.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
